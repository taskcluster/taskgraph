---

loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.run
    - taskgraph.transforms.task

task-defaults:
    attributes:
        retrigger: true
        code-review: true
    worker-type: t-linux
    worker:
        docker-image: {in-tree: python}
        max-run-time: 600
        env:
            LC_ALL: "C"
            PYTHONUTF8: "0"
            PYTHONCOERCECLOCALE: "0"
            HGENCODING: "utf-8"
    treeherder:
        kind: test
        platform: test/opt
        tier: 1
    run:
        using: run-task
        cwd: '{checkout}'
        use-caches: [checkout, uv]

tasks:
    type:
        description: "Run type checking against src with Pyright"
        treeherder:
            symbol: check(type)
        run:
            command: >-
                uv run --all-extras pyright
    scripts-min-python:
        description: >-
            Verify that the standalone scripts consumers run inside tasks
            still support the oldest Python they're used with
        treeherder:
            symbol: check(scripts-min-python)
        run:
            command: >-
                uv run vermin --target=3.8- --violations --eval-annotations --no-tips
                src/taskgraph/run-task/run-task src/taskgraph/run-task/fetch-content &&
                uv run --no-project --python 3.8 python src/taskgraph/run-task/run-task --help > /dev/null &&
                uv run --no-project --python 3.8 python src/taskgraph/run-task/fetch-content --help > /dev/null
