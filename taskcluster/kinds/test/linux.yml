task-defaults:
    matrix:
        substitution-fields:
            - attributes
            - description
            - run.command
            - treeherder
            - worker
    attributes:
        artifact_prefix: public
        retrigger: true
        code-review: true
        python: "{matrix[python]}"
        platform: linux
        resolution: default
    worker-type: t-linux
    worker:
        docker-image: {in-tree: python}
        max-run-time: 1800
        env:
            PYTHONUTF8: "0"
            PYTHONCOERCECLOCALE: "0"
            HGENCODING: "utf-8"
            LC_ALL: "C"
            UV_PYTHON: "{matrix[python]}"
    treeherder:
        platform: test-linux/opt
        kind: test
        tier: 1
    run:
        using: run-task
        cwd: '{checkout}'
        use-caches: [checkout, uv]

unit:
    description: "Run unit tests with py{matrix[python]} on Linux"
    matrix:
        set-name: "unit-py{matrix[python]}"
        substitution-fields: [description, run.command, treeherder, worker, attributes]
        python: [maxt, max..min]
    attributes:
        coverage_artifact: "coverage.py{matrix[python]}"
    worker:
        docker-image: {in-tree: python}
        artifacts:
            - type: file
              path: "/builds/worker/artifacts/coverage"
              name: "public/coverage.py{matrix[python]}"
    treeherder:
        symbol: unit(py{matrix[python]})
    run:
        command: >-
            uv run coverage run --data-file /builds/worker/artifacts/coverage --context=py{matrix[python]} -m pytest -vv &&
            uv run coverage combine --data-file /builds/worker/artifacts/coverage

unit-multithread:
    description: "Run unit tests with py{matrix[python]} on Linux with multithreading enabled"
    matrix:
        set-name: "unit-multithread-py{matrix[python]}"
        substitution-fields: [description, run.command, treeherder, worker, attributes]
        python: [maxt]
    attributes:
        coverage_artifact: "coverage.py{matrix[python]}"
    worker:
        docker-image: {in-tree: python}
        env:
            TASKGRAPH_USE_THREADS: "1"
        artifacts:
            - type: file
              path: "/builds/worker/artifacts/coverage"
              name: "public/coverage.py{matrix[python]}"
    treeherder:
        symbol: unit-multithread(py{matrix[python]})
    run:
        command: >-
            uv run coverage run --data-file /builds/worker/artifacts/coverage --context=py{matrix[python]} -m pytest -vv &&
            uv run coverage combine --data-file /builds/worker/artifacts/coverage

unit-serial:
    description: "Run unit tests with py{matrix[python]} on Linux in serial mode"
    matrix:
        set-name: "unit-serial-py{matrix[python]}"
        substitution-fields: [description, run.command, treeherder, worker, attributes]
        python: [max]
    attributes:
        coverage_artifact: "coverage.serial-py{matrix[python]}"
    worker:
        docker-image: {in-tree: python}
        env:
            TASKGRAPH_SERIAL: "1"
        artifacts:
            - type: file
              path: "/builds/worker/artifacts/coverage"
              name: "public/coverage.serial-py{matrix[python]}"
    treeherder:
        symbol: unit-serial(py{matrix[python]})
    run:
        command: >-
            uv run coverage run --data-file /builds/worker/artifacts/coverage --context=py{matrix[python]} -m pytest -vv &&
            uv run coverage combine --data-file /builds/worker/artifacts/coverage

integration:
    description: "Run unit tests with py{matrix[python]} on Linux with resolution {matrix[resolution]}"
    attributes:
        resolution: "{matrix[resolution]}"
    matrix:
        set-name: "integration-py{matrix[python]}-deps-{matrix[resolution]}"
        python: [max, min]
        resolution: ["highest", "lowest-direct"]
        exclude:
            - python: max
              resolution: "lowest-direct"
            - python: min
              resolution: "highest"

    treeherder:
        symbol: integration(py{matrix[python]}-{matrix[resolution]})
    run:
        command: >-
            uv run --isolated --resolution={matrix[resolution]} pytest -vv
